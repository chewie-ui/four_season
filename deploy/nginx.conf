# Reverse proxy devant Four Seasons.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fourseason
#   sudo ln -s /etc/nginx/sites-available/fourseason /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d fourseason.fr -d www.fourseason.fr
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer fourseason.fr par le domaine réel.

server {
    listen 80;
    listen [::]:80;
    server_name fourseason.fr www.fourseason.fr;
    # certbot pose ici sa redirection vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fourseason.fr www.fourseason.fr;

    # certbot renseigne ssl_certificate / ssl_certificate_key

    # Une photo d'annonce fait couramment 8-10 Mo.
    client_max_body_size 15M;

    # Une génération prend 15 à 40 s. Les valeurs par défaut (60 s) suffisent,
    # mais le téléchargement d'un ZIP de 13 images peut être plus long.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    access_log /var/log/nginx/fourseason.access.log;
    error_log  /var/log/nginx/fourseason.error.log;

    # --- les images générées : servies par nginx, pas par Node -------------
    # Adapter le chemin : /srv/fourseason/storage, ou le point de montage
    # du volume Docker (docker volume inspect fourseason_storage).
    location /media/ {
        alias /srv/fourseason/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Le widget charge ces images depuis les sites de nos clients.
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # --- le widget : chargé depuis des domaines tiers ----------------------
    location = /fourseason.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    # --- le reste ----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sans ces deux en-têtes + TRUST_PROXY=true, la limite de débit
        # voit toutes les requêtes venir du proxy et bride tout le monde
        # dès qu'un seul visiteur est trop actif.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
