# =====================================================================
#  Four Seasons — vhost nginx pour restockdesk.com
#
#  ⚠ CE VPS HÉBERGE DÉJÀ D'AUTRES SITES (branshee.com, crm, flow, julien).
#    Ce fichier est ADDITIF : il crée un nouveau vhost et ne touche à aucun
#    des existants. Ne modifiez ni /etc/nginx/nginx.conf ni les autres
#    fichiers de sites-available.
#
#  Installation :
#    sudo cp deploy/restockdesk.com.conf /etc/nginx/sites-available/restockdesk.com
#    sudo ln -s /etc/nginx/sites-available/restockdesk.com /etc/nginx/sites-enabled/
#    sudo nginx -t          # DOIT dire « syntax is ok » avant la suite
#    sudo systemctl reload nginx
#    sudo certbot --nginx -d restockdesk.com -d www.restockdesk.com
#
#  certbot ajoutera lui-même le bloc 443 et la redirection depuis le 80.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name restockdesk.com www.restockdesk.com;

    # Une photo d'annonce fait couramment 8 à 10 Mo.
    client_max_body_size 15M;

    # Une génération prend 15 à 40 s, et un ZIP de 13 images peut être long.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    access_log /var/log/nginx/four_season.access.log;
    error_log  /var/log/nginx/four_season.error.log;

    # --- les images générées : servies par nginx, jamais par Node ----------
    location /media/ {
        alias /var/www/four_season/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Le widget charge ces images depuis les sites de nos clients :
        # sans cet en-tête, le navigateur les refuse en cross-origin.
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # --- le widget : chargé depuis des domaines tiers ----------------------
    location = /fourseason.js {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    # --- l'application -----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sans ces deux en-têtes + TRUST_PROXY=true côté Node, la limite de
        # débit voit toutes les requêtes venir du proxy : un seul visiteur
        # trop actif briderait tout le monde.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
